# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache-busting version into index.html
        run: |
          CSS_HASH=$(md5sum assets/css/style.css | cut -c1-7)
          JS_HASH=$(md5sum assets/js/main.js | cut -c1-7)

          sed -i -E "s#(assets/css/style\.css)(\?v=[a-zA-Z0-9]+)?#\1?v=${CSS_HASH}#" index.html
          sed -i -E "s#(assets/js/main\.js)(\?v=[a-zA-Z0-9]+)?#\1?v=${JS_HASH}#" index.html

          echo "CSS version: ${CSS_HASH}"
          echo "JS version: ${JS_HASH}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
